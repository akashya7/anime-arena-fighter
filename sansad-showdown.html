<!doctype html>
<html lang="en">

<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#100e1d"><title>Sansad Showdown — Portrait Fighter</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#090812;color:#fff;font-family:system-ui,sans-serif;overflow-x:hidden}.wrap{max-width:1180px;margin:auto;padding:16px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.brand{font-weight:1000;letter-spacing:1.5px}.brand em{color:#ffbc5f;font-style:normal}.tag{font-size:10px;color:#aaa3ba}.panel{display:grid;grid-template-columns:1fr 140px 1fr;gap:10px;margin-bottom:10px}.pick,.cpu{background:#171426;border:1px solid #ffffff1c;border-radius:12px;padding:10px}.label{font-size:9px;font-weight:900;color:#aaa3ba;letter-spacing:1.2px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:7px}.card{border:1px solid #ffffff20;border-radius:9px;background:#ffffff08;color:white;padding:7px 5px;cursor:pointer;text-align:center}.card.active{border-color:var(--c);box-shadow:0 0 18px color-mix(in srgb,var(--c) 35%,transparent)}.avatar{width:48px;height:48px;margin:auto;border-radius:50%;overflow:hidden;background:var(--bg);border:2px solid var(--c)}.avatar canvas{width:48px;height:48px}.card b{display:block;font-size:11px;margin-top:4px}.cpu select,.controls select{width:100%;margin-top:7px;padding:8px;border:1px solid #ffffff22;border-radius:7px;background:#100d1b;color:white}.start{border:0;border-radius:11px;color:#17100b;font-weight:1000;background:linear-gradient(135deg,#ffbe65,#ff4f91);cursor:pointer;font-size:16px}.game{position:relative;border:1px solid #ffffff26;border-radius:16px;overflow:hidden;background:#17132b}.stage{position:relative;aspect-ratio:16/8.5;min-height:300px}.stage canvas{width:100%;height:100%;display:block}.hud{position:absolute;z-index:2;top:12px;left:16px;right:16px;display:grid;grid-template-columns:1fr 54px 1fr;gap:8px}.player{text-align:left}.player.r{text-align:right}.name{font-size:16px;font-weight:1000}.meter{height:13px;padding:2px;border:1px solid #ffffff90;border-radius:10px;background:#0a0812;margin-top:4px}.fill{height:100%;border-radius:7px;background:linear-gradient(90deg,#ff518e,#ffcf72);transition:width .15s}.r .fill{margin-left:auto;background:linear-gradient(90deg,#64dff1,#8792ff)}.timer{text-align:center;font-size:30px;font-weight:1000}.overlay{position:absolute;z-index:4;inset:0;display:grid;place-items:center;text-align:center;background:#090811a6}.overlay.hide{display:none}.overlay h1{font-size:clamp(38px,8vw,76px);line-height:.86;margin:10px}.overlay p{color:#d6cfea;font-size:12px}.overlay button{border:0;border-radius:9px;padding:11px 20px;background:#ffbe65;color:#1a120b;font-weight:1000}.controls{height:50px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid #ffffff18;padding:8px 12px;color:#aaa3ba;font-size:10px}.mobile{display:none}.keys{display:flex;gap:6px}.key{padding:5px 7px;border:1px solid #ffffff25;border-radius:5px;background:#ffffff08;color:white;font-size:9px}@media(max-width:760px){.wrap{padding:8px}.panel{grid-template-columns:1fr 90px}.cpu{grid-column:1/-1}.cards{grid-template-columns:repeat(2,1fr)}.stage{aspect-ratio:4/3}.hud{left:8px;right:8px}.controls{display:none}.mobile{display:flex;justify-content:center;gap:5px;padding:7px}.mobile button{padding:9px 7px;border:1px solid #ffffff25;border-radius:7px;background:#ffffff0d;color:white;font-size:9px}.tag{display:none}}
</style>
</head>
<body><main class="wrap"><header class="top"><div class="brand">SANSAD <em>SHOWDOWN</em></div><div class="tag">ORIGINAL PORTRAIT-INSPIRED CARICATURES · BROWSER 2D FIGHTER</div></header><section class="panel"><div class="pick"><div class="label">CHOOSE FIGHTER</div><div class="cards" id="cards"></div></div><button class="start" id="start">FIGHT</button><div class="cpu"><div class="label">CPU RIVAL & DIFFICULTY</div><select id="cpu"></select><select id="difficulty"><option value="easy">Rookie</option><option value="normal" selected>Rival</option><option value="hard">Champion</option></select></div></section><section class="game"><div class="stage"><canvas id="canvas"></canvas><div class="hud"><div class="player"><div class="name" id="pn">MAYA</div><div class="meter"><div class="fill" id="ph"></div></div></div><div class="timer" id="time">60</div><div class="player r"><div class="name" id="en">ARJUN</div><div class="meter"><div class="fill" id="eh"></div></div></div></div><div class="overlay" id="overlay"><div><div class="label">ROUND 1 · PRIVATE GARAGE ARENA</div><h1 id="otitle">CHOOSE<br>YOUR NETA</h1><p id="ocopy">A satirical, fictional browser fighter inspired by your portraits.</p><button id="play">START</button></div></div></div><div class="controls"><div class="keys"><span class="key">A/D</span>Move <span class="key">W</span>Jump <span class="key">J</span>Punch <span class="key">K</span>Kick <span class="key">L</span>Guard <span class="key">U</span>Super</div><span>ESC PAUSE</span></div><div class="mobile"><button data-k="a">◀</button><button data-k="w">UP</button><button data-k="d">▶</button><button data-k="j">PUNCH</button><button data-k="k">KICK</button><button data-k="l">GUARD</button><button data-k="u">SUPER</button></div></section></main>
<script>
(()=>{'use strict';
const chars=[
{id:'maya',name:'MAYA',title:'Lotus Netaji',skin:'#b97755',hair:'#171018',cloth:'#17382c',cloth2:'#d4bf72',accent:'#65dfbc',kind:'sari',glasses:false,bg:'#17382c'},
{id:'arjun',name:'ARJUN',title:'Silver Comet',skin:'#aa704e',hair:'#201712',cloth:'#ecebe4',cloth2:'#263746',accent:'#69dff2',kind:'shirt',glasses:true,bg:'#31566a'},
{id:'naina',name:'NAINA',title:'Blue Mic',skin:'#a96549',hair:'#151018',cloth:'#27426a',cloth2:'#dfedf0',accent:'#ff84a9',kind:'jacket',glasses:true,bg:'#243758'},
{id:'dev',name:'DEV',title:'Skyward Babu',skin:'#bd8060',hair:'#42342e',cloth:'#48add0',cloth2:'#edf0e8',accent:'#ffc476',kind:'sage',glasses:true,bg:'#397791'}];
const cv=document.querySelector('#canvas'),ctx=cv.getContext('2d'),$=q=>document.querySelector(q);let selected='maya',running=false,over=false,paused=false,last=0,elapsed=0,keys=new Set(),particles=[],shake=0,p,e;
function W(){return cv.clientWidth}function H(){return cv.clientHeight}function G(){return H()*0.82}function S(){return Math.min(W()/900,H()/500)}
function portrait(c,tx,ty,scale=1){tx=tx||W()/2;ty=ty||H()/2;ctx.save();ctx.translate(tx,ty);ctx.scale(scale,scale);ctx.lineWidth=3;ctx.strokeStyle='#201823';ctx.fillStyle=c.skin;ctx.beginPath();ctx.arc(0,-72,34,0,7);ctx.fill();ctx.stroke();ctx.fillStyle=c.hair;ctx.beginPath();ctx.moveTo(-34,-78);ctx.quadraticCurveTo(-37,-119,-2,-126);ctx.quadraticCurveTo(35,-122,35,-79);ctx.lineTo(25,-91);ctx.quadraticCurveTo(4,-103,-26,-80);ctx.closePath();ctx.fill();ctx.fillStyle=c.skin;ctx.fillRect(-10,-43,20,28);ctx.fillStyle=c.cloth;ctx.beginPath();ctx.moveTo(-44,-38);ctx.lineTo(-54,38);ctx.lineTo(54,38);ctx.lineTo(44,-38);ctx.quadraticCurveTo(0,-58,-44,-38);ctx.fill();ctx.stroke();if(c.kind==='sari'){ctx.strokeStyle=c.cloth2;ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(20,-44);ctx.bezierCurveTo(48,-12,25,40,54,75);ctx.stroke();ctx.fillStyle='#11131c';ctx.fillRect(-52,36,104,18)}else if(c.kind==='jacket'){ctx.fillStyle=c.cloth2;ctx.beginPath();ctx.moveTo(-16,-36);ctx.lineTo(0,-10);ctx.lineTo(16,-36);ctx.lineTo(16,36);ctx.lineTo(-16,36);ctx.fill();ctx.stroke()}else{ctx.fillStyle=c.cloth2;ctx.fillRect(-40,-20,80,6)}ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(-11,-74,7,5,0,0,7);ctx.ellipse(11,-74,7,5,0,0,7);ctx.fill();ctx.fillStyle='#38505a';ctx.beginPath();ctx.arc(-9,-74,2.5,0,7);ctx.arc(13,-74,2.5,0,7);ctx.fill();if(c.glasses){ctx.strokeStyle='#302832';ctx.lineWidth=2;ctx.strokeRect(-22,-83,18,14);ctx.strokeRect(4,-83,18,14);ctx.beginPath();ctx.moveTo(-4,-76);ctx.lineTo(4,-76);ctx.stroke()}ctx.strokeStyle='#874c55';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-7,-54);ctx.quadraticCurveTo(0,-49,8,-54);ctx.stroke();ctx.restore()}
function drawCards(){let box=$('#cards');box.innerHTML='';chars.forEach(c=>{let b=document.createElement('button');b.className='card'+(c.id===selected?' active':'');b.style.setProperty('--c',c.accent);b.style.setProperty('--bg',c.bg);b.innerHTML=`<div class="avatar"><canvas data-char="${c.id}" width="48" height="48"></canvas></div><b>${c.name}</b>`;b.onclick=()=>{selected=c.id;drawCards();preview()};box.append(b)});$('#cpu').innerHTML=chars.filter(c=>c.id!==selected).map(c=>`<option value="${c.id}">${c.name} · ${c.title}</option>`).join('');document.querySelectorAll('.avatar canvas').forEach(cv2=>{let cc=chars.find(c=>c.id===cv2.dataset.char),c2=cv2.getContext('2d');c2.save();c2.translate(24,42);c2.scale(.38,.38);const c=cv2;portraitOutside(c2,cc,0,0)});}
function portraitOutside(g,c,tx,ty){g.fillStyle=c.skin;g.beginPath();g.arc(0,-65,30,0,7);g.fill();g.strokeStyle='#201823';g.lineWidth=3;g.stroke();g.fillStyle=c.hair;g.beginPath();g.moveTo(-30,-70);g.quadraticCurveTo(-32,-112,-1,-115);g.quadraticCurveTo(32,-110,31,-70);g.closePath();g.fill();g.fillStyle=c.cloth;g.beginPath();g.moveTo(-42,-35);g.lineTo(-52,58);g.lineTo(52,58);g.lineTo(42,-35);g.closePath();g.fill();g.fillStyle='#fff';g.beginPath();g.ellipse(-10,-65,6,4,0,0,7);g.ellipse(10,-65,6,4,0,0,7);g.fill();g.fillStyle='#38505a';g.beginPath();g.arc(-8,-65,2,0,7);g.arc(12,-65,2,0,7);g.fill();if(c.glasses){g.strokeStyle='#302832';g.strokeRect(-20,-73,16,12);g.strokeRect(4,-73,16,12)}g.restore()}
function fighter(c,side){return{c,side,x:W()*(side===1?.28:.72),y:G(),vx:0,vy:0,hp:100,face:side,air:false,state:'idle',attack:null,guard:false,stun:0,phase:0,age:0,aiWait:.4}}drawCards();p=fighter(chars[0],1);e=fighter(chars[1],-1);
function resize(){let r=cv.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);cv.width=r.width*d;cv.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);draw(performance.now())}addEventListener('resize',resize);
function preview(){if(!running){p=fighter(chars.find(c=>c.id===selected),1);e=fighter(chars.find(c=>c.id===$('#cpu').value)||chars[1],-1);draw(performance.now())}}preview();
function scene(t){let w=W(),h=H(),g=G(),gr=ctx.createLinearGradient(0,0,0,h);gr.addColorStop(0,'#251a43');gr.addColorStop(.7,'#783b58');gr.addColorStop(1,'#d27655');ctx.fillStyle=gr;ctx.fillRect(0,0,w,h);ctx.fillStyle='#171426';ctx.fillRect(0,g,w,h-g);ctx.fillStyle='#ffbc6644';ctx.fillRect(0,g,w,3);for(let i=0;i<15;i++){ctx.fillStyle=i%2?'#2e2444':'#35264c';ctx.fillRect(i*w/15,g*.55,40,g*.27);ctx.fillStyle='#ffcf7044';ctx.fillRect(i*w/15+12,g*.58,5,8)}for(let i=0;i<22;i++){ctx.fillStyle='#fff4';ctx.fillRect((i*163+t*.01)%w,(i*71)% (g*.62),1.5,1.5)}}
function act(f,type){if(!running||over||paused||f.stun>0)return;if(type==='guard'){f.guard=true;f.state='guard';return}if(type==='jump'){if(!f.air){f.air=true;f.vy=-570;f.state='jump'}return}if(f.attack||['hit','fall'].includes(f.state))return;let d=type==='punch'?{range:115,damage:9,dur:.38,active:[.1,.23],kick:false}:type==='kick'?{range:135,damage:12,dur:.52,active:.16}:{range:210,damage:16,dur:.68,active:.22};if(type==='kick')d.active=[.16,.34];f.attack={...d,time:0,hit:false,type};f.state=type}
function key(k,on){k=k.toLowerCase();if(on){if(keys.has(k))return;keys.add(k);if(k==='j')act(p,'punch');if(k==='k')act(p,'kick');if(k==='u')act(p,'super');if(k==='w')act(p,'jump');if(k==='l')act(p,'guard');if(k==='escape'&&running){paused=!paused;if(paused){running=false;overlay('PAUSED','Take a breath before the next round.','RESUME');$('#play').onclick=()=>{paused=false;running=true;$('#overlay').classList.add('hide');last=performance.now();requestAnimationFrame(loop)}}}}else{keys.delete(k);if(k==='l')p.guard=false}}
addEventListener('keydown',e=>{if([' ','ArrowLeft','ArrowRight','ArrowUp'].includes(e.key))e.preventDefault();key(e.key,true)});addEventListener('keyup',e=>key(e.key,false));document.querySelectorAll('[data-k]').forEach(b=>{b.onpointerdown=e=>{e.preventDefault();key(b.dataset.k,true)};for(let n of ['pointerup','pointercancel','pointerleave'])b.addEventListener(n,()=>key(b.dataset.k,false))});
function start(){p=fighter(chars.find(c=>c.id===selected),1);e=fighter(chars.find(c=>c.id===$('#cpu').value)||chars[1],-1);p.x=W()*.28;e.x=W()*.72;running=true;over=false;paused=false;elapsed=0;particles=[];$('#pn').textContent=p.c.name;$('#en').textContent=e.c.name;$('#overlay').classList.add('hide');last=performance.now();requestAnimationFrame(loop)}$('#start').onclick=start;$('#play').onclick=start;function overlay(title,copy,button){$('#otitle').innerHTML=title;$('#ocopy').textContent=copy;$('#play').textContent=button;$('#overlay').classList.remove('hide')}
function AI(dt){let d=Math.abs(p.x-e.x),lev=$('#difficulty').value;e.aiWait-=dt;if(e.aiWait>0)return;e.aiWait=lev==='hard'?.32:lev==='normal'?.58:.9;if(d>155)e.vx=-150,e.state='walk';else if(d<75)e.state='idle',e.aiWait*=.7,Math.random()<.5?act(e,'punch'):act(e,'kick');else Math.random()<.28?act(e,'guard'):Math.random()<.25?act(e,'super'):act(e,'punch')}
function update(f,o,dt,player){f.age+=dt;if(f.stun>0){f.stun-=dt;f.vx*=.9;if(f.stun<=0)f.state='idle'}if(player&&!f.attack&&f.stun<=0&&!['hit','fall'].includes(f.state)){let l=keys.has('a'),r=keys.has('d');if(l!==r){f.vx=(l?-1:1)*210;f.state='walk';f.phase+=dt*8}else{f.vx*=.82;if(!f.guard)f.state='idle'}f.guard=keys.has('l');if(f.guard)f.state='guard'}if(!f.attack&&!['hit','fall'].includes(f.state))f.face=o.x>=f.x?1:-1;if(f.attack){f.attack.time+=dt;let q=f.attack,a=q.active[0],b=q.active[1];if(!q.hit&&q.time>=a&&q.time<=b&&Math.abs(o.x-f.x)<q.range&&Math.sign(o.x-f.x)===f.face){q.hit=true;hit(f,o,q)}if(q.time>=q.dur){f.attack=null;f.state='idle'}}if(f.air){f.vy+=1450*dt;f.y+=f.vy*dt;if(f.y>=G()){f.y=G();f.vy=0;f.air=false;f.state='idle'}}f.x=Math.max(38,Math.min(W()-38,f.x+f.vx*dt))}
function hit(a,d,q){let blocked=d.guard&&Math.sign(a.x-d.x)===d.face,dmg=blocked?2:q.damage;d.hp=Math.max(0,d.hp-dmg);d.state=blocked?'guard':'hit';d.stun=blocked?.08:.26;d.vx=Math.sign(d.x-a.x)*(blocked?45:155);shake=blocked?3:8;for(let i=0;i<12;i++)particles.push({x:d.x+(Math.random()-.5)*25,y:d.y-80-Math.random()*50,vx:(Math.random()-.5)*200,vy:-Math.random()*160,life:.35,color=blocked?'#74eafa':a.c.accent,size:2+Math.random()*4})}
function loop(now){if(!running)return;let dt=Math.min(.033,(now-last)/1000||0);last=now;elapsed+=dt;$('#time').textContent=String(Math.max(0,60-Math.floor(elapsed))).padStart(2,'0');AI(dt);update(p,e,dt,true);update(e,p,dt,false);particles.forEach(q=>{q.life-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=350*dt});particles=particles.filter(q=>q.life>0);shake=Math.max(0,shake-30*dt);draw(now);$('#ph').style.width=p.hp+'%';$('#eh').style.width=e.hp+'%';if(p.hp<=0||e.hp<=0||elapsed>=60){running=false;over=true;let winner=p.hp===e.hp?'DRAW':p.hp>e.hp?p.c.name:e.c.name;overlay(winner==='DRAW'?'DRAW':winner+' WINS!',winner==='DRAW'?'A perfect tie.':'The house has a champion.','REMATCH');return}requestAnimationFrame(loop)}
function line(a,b,c,d,w,col){ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#241927';ctx.lineWidth=w+4;ctx.beginPath();ctx.moveTo(a,b);ctx.lineTo(c,d);ctx.stroke();ctx.strokeStyle=col;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(a,b);ctx.lineTo(c,d);ctx.stroke()}
function fighterDraw(f,t){let c=f.c,s=S(),x=f.x,y=f.y,d=f.face;ctx.save();ctx.translate(x,y);ctx.scale(s*d,s);let bob=f.state==='idle'?Math.sin(t*.004+f.side)*2:f.state==='walk'?Math.sin(f.phase)*5:0;ctx.globalAlpha=.32;ctx.fillStyle='#05030a';ctx.beginPath();ctx.ellipse(0,2,44,9,0,0,7);ctx.fill();ctx.globalAlpha=1;let swing=f.state==='walk'?Math.sin(f.phase)*12:0;line(-9,-50+bob,-18+swing,-29+bob,14,c.kind==='shirt'?'#25232a':'#242532');line(-18+swing,-29+bob,-20+swing*.6,-5,10,c.skin);line(9,-50+bob,18-swing,-29+bob,14,c.kind==='shirt'?'#25232a':'#242532');line(18-swing,-29+bob,20-swing*.6,-5,10,c.skin);ctx.fillStyle='#11101a';ctx.beginPath();ctx.ellipse(-15,-3,15,5,0,0,7);ctx.ellipse(25,-3,15,5,0,0,7);ctx.fill();ctx.fillStyle=c.cloth;ctx.beginPath();ctx.moveTo(-18,-108+bob);ctx.lineTo(-28,-88+bob);ctx.lineTo(-19,-48+bob);ctx.lineTo(20,-48+bob);ctx.lineTo(28,-88+bob);ctx.lineTo(17,-108+bob);ctx.closePath();ctx.fill();ctx.strokeStyle='#201923';ctx.lineWidth=3;ctx.stroke();ctx.strokeStyle=c.cloth2;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-16,-98+bob);ctx.lineTo(12,-54+bob);ctx.stroke();if(c.kind==='sari'){ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(16,-102+bob);ctx.bezierCurveTo(40,-74+bob,22,-35,48,-8);ctx.stroke()}let armL=[-25,-78,-26,-60],armR=[25,-78,28,-62];if(f.guard){armL=[-22,-112,-8,-124];armR=[22,-112,8,-124]}if(f.attack&&f.state==='punch'){let a=Math.sin(Math.min(1,f.attack.time/f.attack.dur)*Math.PI);armR=[27+a*28,-88+bob,35+a*58,-92+bob]}line(-17,-96+bob,armL[0],armL[1]+bob,13,c.cloth);line(armL[0],armL[1]+bob,armL[2],armL[3]+bob,9,c.skin);line(17,-96+bob,armR[0],armR[1]+bob,13,c.cloth);line(armR[0],armR[1]+bob,armR[2],armR[3]+bob,9,c.skin);ctx.fillStyle=c.skin;ctx.fillRect(-6,-122+bob,12,17);let face=ctx.createRadialGradient(-5,-140+bob,3,0,-136+bob,25);face.addColorStop(0,'#ffe2bf');face.addColorStop(.72,c.skin);face.addColorStop(1,'#94574a');ctx.fillStyle=face;ctx.beginPath();ctx.ellipse(0,-138+bob,18,23,0,0,7);ctx.fill();ctx.strokeStyle='#231923';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle=c.hair;ctx.beginPath();ctx.moveTo(-18,-141+bob);ctx.quadraticCurveTo(-22,-166+bob,-3,-168+bob);ctx.quadraticCurveTo(16,-169+bob,20,-146+bob);ctx.lineTo(11,-143+bob);ctx.quadraticCurveTo(0,-155+bob,-11,-143+bob);ctx.closePath();ctx.fill();for(let ex of[-8,8]){ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(ex,-138+bob,5,3.5,0,0,7);ctx.fill();ctx.fillStyle='#3b5057';ctx.beginPath();ctx.arc(ex+1,-138+bob,2,0,7);ctx.fill()}if(c.glasses){ctx.strokeStyle='#302832';ctx.lineWidth=2;ctx.strokeRect(-21,-148+bob,14,11);ctx.strokeRect(7,-148+bob,14,11);ctx.beginPath();ctx.moveTo(-7,-143+bob);ctx.lineTo(7,-143+bob);ctx.stroke()}ctx.strokeStyle='#934f56';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-8,-127+bob);ctx.quadraticCurveTo(0,-122+bob,9,-127+bob);ctx.stroke();ctx.restore()}
function draw(t){if(!cv.width)return;ctx.save();if(shake)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);scene(t);fighterDraw(p,t);fighterDraw(e,t);for(let q of particles){ctx.globalAlpha=Math.max(0,q.life*3);ctx.fillStyle=q.color;ctx.beginPath();ctx.arc(q.x,q.y,q.size,0,7);ctx.fill()}ctx.restore()}function idle(t){if(!running){draw(t);requestAnimationFrame(idle)}}requestAnimationFrame(()=>{resize();idle(performance.now())});
})();
</script></body></html>
